<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="b1" cx="12%" cy="18%" r="45%"><stop offset="0" stop-color="#6ea68c" stop-opacity=".40"/><stop offset="1" stop-color="#6ea68c" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="92%" cy="88%" r="50%"><stop offset="0" stop-color="#e07a5c" stop-opacity=".38"/><stop offset="1" stop-color="#e07a5c" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="78%" cy="8%" r="35%"><stop offset="0" stop-color="#c58b4b" stop-opacity=".28"/><stop offset="1" stop-color="#c58b4b" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e07a5c" stop-opacity=".30"/><stop offset=".5" stop-color="#b4846c" stop-opacity=".20"/><stop offset="1" stop-color="#6ea68c" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".72" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9967a"/><stop offset="1" stop-color="#9cc8b2"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e07a5c"/><stop offset="1" stop-color="#6ea68c"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blurcar" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a3a26" flood-opacity=".16"/></filter>
    <mask id="car" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <path fill="#fff" d="M25.6 17.6h12.8a2.2 2.2 0 0 1 2 1.4l2.2 5.8H21.4l2.2-5.8a2.2 2.2 0 0 1 2-1.4z"/>
      <rect fill="#fff" x="19.6" y="24" width="24.8" height="9.6" rx="3.2"/>
      <rect fill="#fff" x="21.8" y="32" width="4.8" height="4.4" rx="1.5"/><rect fill="#fff" x="37.4" y="32" width="4.8" height="4.4" rx="1.5"/>
      <path fill="#000" d="M26.4 19.6h11.2l1.5 3.8H24.9z"/>
      <circle fill="#000" cx="24.4" cy="28.6" r="1.9"/><circle fill="#000" cx="39.6" cy="28.6" r="1.9"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#f2f1ec"/>
  <rect width="1200" height="630" fill="url(#b1)"/>
  <rect width="1200" height="630" fill="url(#b2)"/>
  <rect width="1200" height="630" fill="url(#b3)"/>

  <!-- soft routes and a blurred car behind the glass -->
  <g opacity=".35" filter="url(#soft)">
    <path d="M-40 520C180 520 260 330 470 330S760 520 1000 420 1240 300 1260 300" fill="none" stroke="url(#road)" stroke-width="46" stroke-linecap="round"/>
    <path d="M-40 520C180 520 260 330 470 330S760 520 1000 420 1240 300 1260 300" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="20 26" stroke-linecap="round" opacity=".8"/>
  </g>
  <g opacity=".28" filter="url(#blurcar)" transform="translate(900 60) scale(4.2)">
    <path fill="url(#road)" d="M5.5 40.5C5.5 36.8 7.6 34.6 11.4 33.8L19.6 32.2C23.4 26.4 28 22.4 34.2 21.6C40.8 20.8 46.6 22 50.6 25.2C53 27.1 54.8 29.6 56 32.2C59 33 60.5 35 60.5 38V40.5C60.5 42.3 59.2 43.5 57.4 43.5H52.2A7 7 0 0 0 38.2 43.5H25.8A7 7 0 0 0 11.8 43.5H8.4C6.8 43.5 5.5 42.2 5.5 40.5Z"/>
    <circle fill="url(#road)" cx="18.8" cy="43.8" r="5.6"/><circle fill="url(#road)" cx="45.2" cy="43.8" r="5.6"/>
  </g>

  <!-- glass card -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="490" rx="44" fill="#ffffff" fill-opacity=".52"/>
  </g>
  <rect x="70" y="70" width="1060" height="490" rx="44" fill="url(#glass)"/>
  <rect x="70" y="70" width="1060" height="490" rx="44" fill="url(#sheen)" opacity=".7"/>
  <rect x="71.5" y="71.5" width="1057" height="487" rx="42.5" fill="none" stroke="#c9a46a" stroke-opacity=".85" stroke-width="3"/>
  <rect x="75" y="75" width="1050" height="480" rx="39" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>

  <!-- logo -->
  <g transform="translate(128 118) scale(1.5)">
    <path d="M32 5C20.4 5 11 14.2 11 25.6c0 14.6 16.4 28.4 19.4 30.8a2.5 2.5 0 0 0 3.2 0C36.6 54 53 40.2 53 25.6 53 14.2 43.6 5 32 5z" fill="url(#pin)" stroke="#c9a46a" stroke-width="2"/>
    <rect width="64" height="64" fill="#3a2414" mask="url(#car)"/>
  </g>
  <text x="232" y="180" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#22272e" letter-spacing="-1">Tripjot</text>

  <text font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="800" fill="#22272e" letter-spacing="-2.5">
    <tspan x="134" y="318" font-size="78">Every work mile,</tspan>
    <tspan x="134" y="408" font-size="78" fill="#9a5a3a">logged automatically.</tspan>
  </text>
  <text x="136" y="490" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="500" fill="#4b5664">For anyone who drives for work in the UK</text>
</svg>
