# Netlify settings for the Tripjot waitlist site.
# Налаштування Netlify: сайт лежить у папці public, збирання не потрібне.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Old Netlify address -> main domain.
# Стара адреса Netlify -> основний домен.
[[redirects]]
  from = "https://tripjot-uk.netlify.app/*"
  to = "https://tripjot.app/:splat"
  status = 301
  force = true
