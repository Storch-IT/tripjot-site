# Netlify settings for the Tripjot waitlist site.
# Настройки Netlify: сайт лежит в папке public, сборка не нужна.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
